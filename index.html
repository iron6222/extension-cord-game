<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>延長線安全小達人</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:linear-gradient(135deg,#dff3ff,#f7fbff);color:#1f2b3a}
.app{width:min(1180px,100%);margin:auto;padding:14px 18px 28px}
.screen{display:none}.screen.active{display:block;animation:fadeIn .35s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.header{
    background:linear-gradient(135deg,#07376c,#0a5da8);
    color:white;
    border-radius:22px;
    padding:14px 28px;
    min-height:105px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    text-align:center;     /* 新增 */
    align-items:center;    /* 新增 */

    box-shadow:0 8px 24px #0003;
}

.title{font-size:42px;font-weight:900;line-height:1.1}.title span{color:#ffd84d}.subtitle{font-size:18px;margin-top:6px;font-weight:700}
.home-layout{margin-top:14px;display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.panel{background:white;border:4px solid #0b5fa5;border-radius:22px;padding:18px;box-shadow:0 8px 22px #0002}
.home-main{display:grid;grid-template-columns:.95fr 1.05fr;gap:16px;align-items:stretch}

.home-image{
    width:100%;
    height:330px;
    object-fit:contain;

    border:3px solid #c6ddeb;
    border-radius:18px;
    background:#f7fbff;

    padding:10px;
}

.home-info h2{
    margin:4px 0 10px;
    font-size:32px;
    color:#0b376f
}

.home-info p{
    font-size:19px;
    line-height:1.65;
    font-weight:700
}
.player-form{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:20px 0;
}

.player-form input{
  padding:14px;
  font-size:18px;
  border:2px solid #b7cde0;
  border-radius:12px;
  font-weight:700;
}
/* 新增這段 */
.intro-list{
    margin:0 0 18px 0;
    padding-left:34px;
    font-size:19px;
    line-height:1.8;
    font-weight:700;
}

.intro-list li{
    margin-bottom:8px;
}
.btn{border:none;border-radius:14px;padding:12px 24px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #0004;transition:.12s}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0004}
.primary{background:linear-gradient(#ffe36c,#ffb51c);border:3px solid #8d5700;color:#111}.blue{background:linear-gradient(#2c9df0,#0754a4);border:3px solid #07376c;color:white}.green{background:linear-gradient(#35ca6e,#138a45);border:3px solid #0a6330;color:white}
.preview-card{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:#f8fcff;border:2px solid #c4d9ea;border-radius:14px;padding:10px;margin-bottom:10px}
.preview-num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#0b5fa5;color:white;font-size:24px;font-weight:900}
.preview-card h3{margin:0;font-size:20px}.preview-card p{margin:3px 0 0;color:#536270;font-size:14px;line-height:1.35}.tip{margin-top:12px;background:#07376c;color:white;border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5}.editor-note{margin-top:12px;background:#fff8d8;border:2px solid #e2b600;border-radius:14px;padding:12px 14px;line-height:1.55;font-size:14px}
.topbar{background:#07376c;color:white;border-radius:18px;padding:12px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 6px 16px #0003}.status{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff2;border:1px solid #fff5;border-radius:999px;padding:7px 13px;font-weight:900}
.progress{height:12px;border-radius:999px;background:#c8ddeb;overflow:hidden;margin-bottom:12px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#22a75a,#ffd84d);transition:.35s}
.game-card{background:white;border:4px solid #0b5fa5;border-radius:22px;padding:16px;box-shadow:0 8px 22px #0002}.question{background:#f5fbff;border-radius:16px;padding:14px 16px;margin-bottom:14px}.question h2{margin:0;font-size:28px;color:#0b376f}.question p{margin:6px 0 0;font-size:18px;color:#d12525;font-weight:900}
.game-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.scene-image{width:100%;height:330px;object-fit:contain;border-radius:18px;border:3px solid #bcd4e7;background:#f7fbff}.quiz-panel{background:#f4f8fc;border:3px solid #c4d9ea;border-radius:18px;padding:14px}.quiz-panel h3{margin:0 0 10px;font-size:23px}
.option{display:block;width:100%;text-align:left;background:white;border:3px solid #c4d5e2;border-radius:13px;padding:12px;margin-bottom:9px;font-size:17px;font-weight:800;cursor:pointer}.option.selected{background:#fff1c7;border-color:#f2a400}.feedback{display:none;margin-top:10px;border-radius:14px;padding:13px;font-size:16px;font-weight:800;line-height:1.5}.good{background:#e2ffe8;color:#106a2f;border:2px solid #31b55c}.bad{background:#ffe6e6;color:#9a1515;border:2px solid #e75a5a}.action-row{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.transition-box,.result-box{max-width:820px;margin:40px auto;background:white;border:5px solid #0b5fa5;border-radius:28px;text-align:center;padding:34px;box-shadow:0 12px 30px #0003}.transition-box h1{font-size:44px;margin:0 0 12px;color:#0b376f}.transition-score{font-size:42px;font-weight:900;color:#f0a000;margin:10px 0}
.score-big{font-size:90px;font-weight:1000;color:#ffd21f;text-shadow:4px 5px 0 #07376c;margin:6px 0}.stars{font-size:56px;margin:8px 0}.rank{display:inline-block;background:linear-gradient(#ffdf69,#ff9c1a);border:4px solid #9a5600;border-radius:999px;padding:10px 28px;font-size:26px;font-weight:900;margin:12px 0}.review-list{margin-top:18px;text-align:left;background:#f7fbff;border:2px solid #c8ddeb;border-radius:16px;padding:16px}.review-item{padding:8px 0;border-bottom:1px solid #d9e7f1}.review-item:last-child{border-bottom:none}
@media(max-width:900px){.home-layout,.home-main,.game-layout{grid-template-columns:1fr}.title{font-size:34px}.home-image,.scene-image{height:260px}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
<div class="header"><div class="title">延長線安全<span>小達人</span> ⚡</div><div class="subtitle">找出危險用電行為，避免火災發生！</div></div>
<div class="home-layout">
<div class="panel">
<div class="home-main"><img class="home-image" src="images/level.png" alt="首頁主視覺">
<button class="btn primary" onclick="startGame()">▶ 開始遊戲</button></div></div>
<div class="home-info">
<h2>遊戲說明</h2>
<ul class="intro-list">
    <li>請依序完成所有挑戰關卡。</li>
    <li>每關選擇正確答案，答對加分，答錯會顯示正確觀念。</li>
</ul>
<p>
目標：學會延長線安全使用原則，避免過載、發熱與火災。
</p>
<div class="player-form">
  <input id="playerName" type="text" placeholder="請輸入姓名">
  <input id="employeeId" type="text" placeholder="請輸入工號">
  <input id="department" type="text" placeholder="請輸入部門">
</div>

<!-- <div class="editor-note"><b>定期更換遊戲內容方式：</b><br>1. 圖片：替換 images 資料夾內同檔名圖片。<br>2. 題目、答案、提示、解說：修改 HTML 下方 <b>levels</b> 陣列。<br>3. 若要新增關卡：複製 levels 陣列其中一段即可。</div> -->
</div>
<div><div id="levelPreview"></div><div class="tip">💡 小提醒：使用延長線時，請遵守安全原則，才能避免火災及危險！</div></div>
</div>
</section>

<section id="game" class="screen">
<div class="topbar"><div class="status"><div class="pill" id="levelPill">關卡 1 / 5</div><div class="pill">⭐ 得分 <span id="scoreText">0</span></div><div class="pill">⏱ <span id="timerText">20</span> 秒</div></div><button class="btn blue" onclick="confirmHome()">回首頁</button></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="game-card"><div class="question"><h2 id="questionTitle"></h2><p id="questionSub"></p></div><div class="game-layout"><img id="sceneImage" class="scene-image" alt="關卡圖片"><div class="quiz-panel"><h3>請選擇正確答案</h3><div id="options"></div><div class="feedback" id="feedback"></div><div class="action-row"><button class="btn blue" onclick="showHint()">提示</button><button class="btn primary" id="submitBtn" onclick="submitAnswer()">送出答案</button><button class="btn green" id="nextBtn" onclick="showTransition()" style="display:none;">下一步 ➜</button></div></div></div></div>
</section>

<section id="transition" class="screen"><div class="transition-box"><h1 id="transitionTitle">第 1 關完成！</h1><div class="transition-score" id="transitionScore">安全觀念 +20</div><p id="transitionText" style="font-size:20px;font-weight:800;line-height:1.6;"></p><button class="btn primary" onclick="nextLevel()">繼續下一關</button></div></section>

<section id="result" class="screen"><div class="result-box"><h1 style="font-size:44px;margin:0;">遊戲結束！</h1><div class="score-big"><span id="finalScore">0</span> 分</div><div class="stars" id="stars">⭐⭐⭐</div><div class="rank" id="rankText">延長線安全小達人</div><div style="font-size:20px;font-weight:800;margin-top:10px;">正確題數：<span id="correctCount">0</span> / <span id="totalCount">5</span>｜遊戲時間：<span id="totalTime">0</span> 秒</div><div class="review-list" id="wrongReview"></div><div style="margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="btn blue" onclick="showScreen('home')">回首頁</button><button class="btn primary" onclick="startGame()">再玩一次</button></div></div></section>
</div>

<script>
/* =========================================================
   關卡資料區
   你之後如果要改題目、選項、答案、提示、解說、圖片，
   主要就是修改這一區。
========================================================= */

const levels = [
    {
        title: "請不要插好插滿",
        question: "這個情境最大的危險是什麼？",
        image: "images/level1_overload.png",
        hint: "看到延長線的插孔插滿了，就要想到過載、發熱、危險。",
        options: [
            "只是看起來凌亂，沒有危險",
            "插頭顏色不同，所以不能一起使用",
            "一個插座插太多電器，可能過載發熱"
        ],
        answer: 2, // 正確答案：C。注意：A=0、B=1、C=2
        explanation: "延長線過載可能造成發熱、熔毀，嚴重時甚至引發火災。"
    },
    {
        title: "不延長又延長",
        question: "為什麼延長線不建議一條接一條？",
        image: "images/level2_chain.png",
        hint: "延長線越接越長，不代表越安全，反而可能增加接點與負載風險。",
        options: [
            "串接會增加接點與發熱風險，應避免",
            "比較方便，所以可以一直串接",
            "只要插得進去就沒問題"
        ],
        answer: 0, // 正確答案：A。注意：A=0、B=1、C=2
        explanation: "延長線串接會增加接點、電阻與發熱機會，也容易忽略負載總量。"
    },
    {
        title: "不使用高功率家電",
        question: "下列哪一類電器最不適合接在一般延長線？",
        image: "images/level3_highpower.png",
        hint: "會快速加熱、產生大量熱能的設備，通常功率較高，此類家電不適合插在延長線上。",
        options: [
            "手機充電器",
            "電鍋、電熱水壺、電磁爐等高功率家電",
            "小型桌燈"
        ],
        answer: 1, // 正確答案：B。注意：A=0、B=1、C=2
        explanation: "高功率家電容易造成延長線過載，建議直接使用牆壁插座並確認規格。"
    },
    {
        title: "不綑綁使用",
        question: "延長線為什麼不可綑綁使用？",
        image: "images/level4_bundle.png",
        hint: "電線使用時會發熱，散熱不良就是危險。",
        options: [
            "綑綁比較醜，所以不建議",
            "熱量不易散出，可能造成外皮熔化或短路",
            "綑綁會讓電流變小"
        ],
        answer: 1, // 正確答案：B。注意：A=0、B=1、C=2
        explanation: "延長線綑綁後散熱不良，長時間使用可能造成外皮熔化或短路。"
    },
    {
        title: "要定期汰舊換新",
        question: "如果延長線外皮破損、插座鬆動或有焦味，應該怎麼做？",
        image: "images/level5_old.png",
        hint: "有破損、焦味、發燙，都不是小問題。",
        options: [
            "繼續使用，等完全壞掉再換",
            "貼膠帶後繼續使用即可",
            "立即停止使用並更換新品"
        ],
        answer: 2, // 正確答案：C。注意：A=0、B=1、C=2
        explanation: "老舊或破損的延長線容易造成短路、漏電或感電，應立即停止使用並更換。"
    }
];

/* =========================================================
   遊戲狀態變數
========================================================= */

let current = 0;          // 目前第幾關，從 0 開始
let score = 0;            // 目前分數
let correct = 0;          // 答對題數
let selected = null;      // 玩家目前選到的答案索引
let answered = false;     // 這一題是否已經作答
let timeLeft = 20;        // 每題倒數秒數
let timer = null;         // 計時器物件
let startedAt = 0;        // 遊戲開始時間
let wrongAnswers = [];    // 錯題回顧資料

/* =========================================================
   畫面切換
========================================================= */

function showScreen(id){
    // 先把所有畫面隱藏
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    // 顯示指定的畫面
    document.getElementById(id).classList.add("active");

    // 如果不是遊戲畫面，就停止計時器
    if(id !== "game"){
        stopTimer();
    }
}

/* =========================================================
   首頁右側關卡清單
========================================================= */

function buildPreview(){
    // 依 levels 自動產生右側 1~5 關的清單
    document.getElementById("levelPreview").innerHTML = levels.map((lv, i) => `
        <div class="preview-card">
            <div class="preview-num">${i + 1}</div>
            <div>
                <h3>${lv.title}</h3>
                <p>${lv.subtitle || ""}</p>
            </div>
        </div>
    `).join("");
}

/* =========================================================
   開始遊戲
========================================================= */

function startGame(){

    const name = document.getElementById("playerName").value.trim();
    const empId = document.getElementById("employeeId").value.trim();
    const dept = document.getElementById("department").value.trim();

    // 姓名：只能中文，2～5 個字
    const nameRule = /^[\u4e00-\u9fa5]{2,5}$/;

    // 工號：只能數字，建議 2～10 碼
    const empRule = /^[0-9]{2,10}$/;

    // 部門：只能中文，2～10 個字
    const deptRule = /^[\u4e00-\u9fa5]{2,10}$/;

    if(!nameRule.test(name)){
        alert("姓名請輸入中文，長度 2～5 個字。");
        return;
    }

    if(!empRule.test(empId)){
        alert("工號請輸入數字，長度 2～10 碼。");
        return;
    }

    if(!deptRule.test(dept)){
        alert("部門請輸入中文，長度 2～10 個字。");
        return;
    }

    localStorage.setItem("playerName", name);
    localStorage.setItem("employeeId", empId);
    localStorage.setItem("department", dept);

    current = 0;
    score = 0;
    correct = 0;
    wrongAnswers = [];
    startedAt = Date.now();

    showScreen("game");
    renderLevel();
}

/* =========================================================
   隱藏式跳關功能
   如果未來要測試第 3 關，可在瀏覽器 Console 輸入：
   goToLevel(3)
========================================================= */

function goToLevel(n){
    // 把輸入的關卡數字轉成陣列索引，並限制在有效範圍內
    current = Math.max(0, Math.min(n - 1, levels.length - 1));

    score = 0;               // 分數歸零
    correct = 0;             // 答對題數歸零
    selected = null;         // 清空選擇
    answered = false;        // 清空作答狀態
    wrongAnswers = [];       // 清空錯題回顧
    startedAt = Date.now();  // 記錄開始時間

    showScreen("game");      // 切換到遊戲畫面
    renderLevel();           // 顯示指定關卡
}

/* =========================================================
   顯示目前關卡
========================================================= */

function renderLevel(){
    stopTimer();       // 先停止上一題的計時器
    selected = null;   // 清空選擇
    answered = false;  // 重新開放作答

    const lv = levels[current]; // 取得目前關卡資料

    // 更新上方狀態列：關卡數、分數、進度條
    document.getElementById("levelPill").textContent = `關卡 ${current + 1} / ${levels.length}`;
    document.getElementById("scoreText").textContent = score;
    document.getElementById("progressBar").style.width = `${(current / levels.length) * 100}%`;

    // 更新題目文字與圖片
    document.getElementById("questionTitle").textContent = lv.question;
    document.getElementById("questionSub").textContent = lv.subtitle || "";
    document.getElementById("sceneImage").src = lv.image;

    // 產生答案選項
    document.getElementById("options").innerHTML = lv.options.map((optionText, index) => `
        <button class="option" onclick="selectOption(${index})">
            ${String.fromCharCode(65 + index)}. ${optionText}
        </button>
    `).join("");

    // 隱藏答案回饋區
    const fb = document.getElementById("feedback");
    fb.style.display = "none";
    fb.className = "feedback";
    fb.textContent = "";

    // 顯示「送出答案」按鈕，隱藏「下一步」按鈕
    document.getElementById("submitBtn").style.display = "inline-block";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("nextBtn").textContent = "下一步 ➜";

    // 啟動倒數計時
    timeLeft = 20;
    updateTimer();

    timer = setInterval(() => {
        timeLeft--;     // 秒數減 1
        updateTimer();  // 更新畫面秒數

        if(timeLeft <= 0){
            stopTimer();

            // 如果時間到但還沒作答，視為答錯
            if(!answered){
                selected = null;
                showFeedback(false, true);
            }
        }
    }, 1000);
}

/* =========================================================
   玩家選擇答案
========================================================= */

function selectOption(index){
    // 如果已經作答，就不允許再選
    if(answered) return;

    selected = index; // 記錄玩家選擇的答案索引

    // 更新選項外觀，只有被選到的選項會加上 selected 樣式
    document.querySelectorAll(".option").forEach((button, idx) => {
        button.classList.toggle("selected", idx === index);
    });
}

/* =========================================================
   送出答案
========================================================= */

function submitAnswer(){
    // 如果已經作答，就不重複送出
    if(answered) return;

    // 沒有選答案時提醒玩家
    if(selected === null){
        alert("請先選擇一個答案！");
        return;
    }

    // 判斷是否答對
    const isCorrect = selected === levels[current].answer;

    // 顯示答題回饋
    showFeedback(isCorrect, false);
}

/* =========================================================
   顯示答題結果與解說
========================================================= */

function showFeedback(good, timeout){
    // 標記本題已經作答完成，避免玩家重複作答
    answered = true;

    // 停止倒數計時器
    stopTimer();

    // 取得目前關卡資料
    const lv = levels[current];

    if(good){
        // 如果答案正確，分數增加 20 分
        score += 20;

        // 正確題數增加 1
        correct++;
    }else{
        // 如果答案錯誤或時間到，加入錯題回顧
        wrongAnswers.push({
            title: lv.title,                         // 關卡名稱
            question: lv.question,                   // 題目內容
            correctAnswer: lv.options[lv.answer],    // 正確答案文字
            explanation: lv.explanation              // 答案解說
        });
    }

    // 更新畫面上的分數
    document.getElementById("scoreText").textContent = score;

    // 取得答案回饋區塊
    const fb = document.getElementById("feedback");

    // 顯示回饋區塊
    fb.style.display = "block";

    // 答對套用 good 樣式，答錯套用 bad 樣式
    fb.className = "feedback " + (good ? "good" : "bad");

    // 顯示回饋文字
    fb.textContent = good
        ? "答對！" + lv.explanation
        : (timeout ? "時間到！" : "答錯！")
          + "正確答案是：「"
          + lv.options[lv.answer]
          + "」。"
          + lv.explanation;

    // 將正確答案標示為綠色，玩家選錯的答案標示為紅色
    document.querySelectorAll(".option").forEach((button, idx) => {
        if(idx === lv.answer){
            button.style.borderColor = "#22a75a";
        }

        if(idx === selected && idx !== lv.answer){
            button.style.borderColor = "#d93b3b";
        }
    });

    // 隱藏送出答案按鈕
    document.getElementById("submitBtn").style.display = "none";

    // 顯示下一步按鈕
    document.getElementById("nextBtn").style.display = "inline-block";

    // 如果是最後一關，把按鈕文字改成「完成遊戲」
    document.getElementById("nextBtn").textContent =
        current === levels.length - 1 ? "🎉 完成遊戲" : "下一步 ➜";
}

/* =========================================================
   關卡完成過場畫面
========================================================= */

function showTransition(){
    const lv = levels[current];

    // 如果是最後一關，顯示完成所有挑戰
    document.getElementById("transitionTitle").textContent =
        current === levels.length - 1
            ? "🎉 恭喜完成所有挑戰！"
            : `第 ${current + 1} 關完成！`;

    // 如果答對顯示 +20，答錯顯示再加強
    document.getElementById("transitionScore").textContent =
        selected === lv.answer ? "安全觀念 +20" : "安全觀念再加強";

    // 顯示本關解說
    document.getElementById("transitionText").textContent = lv.explanation;

    // 最後一關按鈕文字改成「查看成績」
    const transitionButton = document.querySelector("#transition .btn.primary");
    transitionButton.textContent =
        current === levels.length - 1 ? "查看成績" : "繼續下一關";

    showScreen("transition");
}

/* =========================================================
   進入下一關或完成遊戲
========================================================= */

function nextLevel(){
    if(current < levels.length - 1){
        // 還有下一關時，關卡加 1
        current++;

        // 回到遊戲畫面
        showScreen("game");

        // 顯示下一關內容
        renderLevel();
    }else{
        // 已經是最後一關，進入結果頁
        finishGame();
    }
}

/* =========================================================
   結果頁
========================================================= */
function saveGameResult(){

    const name = localStorage.getItem("playerName") || "";
    const employeeId = localStorage.getItem("employeeId") || "";
    const department = localStorage.getItem("department") || "";

    const result = {
        time: new Date().toLocaleString(),
        name: name,
        employeeId: employeeId,
        department: department,
        score: score,
        correct: correct,
        total: levels.length,
        wrongQuestions: wrongAnswers.map(w => w.title).join("、"),
        needImprove: wrongAnswers.map(w => w.explanation).join("；"),
        status: "已完成"
    };

   console.log("本次遊戲紀錄：", result);

   submitResultToGoogleSheet(result);

   return result;
}
function submitResultToGoogleSheet(data){

    const url = "https://script.google.com/macros/s/AKfycbzdAovH8eCdQ0lqK1hMW7dhzPmkNCW9DYYFCcDtDaZkCou9HkOH4kGo7mSnshRcLQpOVA/exec";
                
    fetch(url,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify(data)
    })
    .then(()=>{
        console.log("已送出成績資料");
    })
    .catch(error=>{
        console.error("上傳失敗：",error);
    });
}

function finishGame(){
    stopTimer();
    const gameResult = saveGameResult();
    //submitResultToGoogleSheet();
    // 計算總花費時間
    const sec = Math.round((Date.now() - startedAt) / 1000);

    // 更新成績資訊
    document.getElementById("finalScore").textContent = score;
    document.getElementById("correctCount").textContent = correct;
    document.getElementById("totalCount").textContent = levels.length;
    document.getElementById("totalTime").textContent = sec;

    // 依分數設定稱號
    let rank = "安全觀念新手";
    let stars = "⭐";

    if(score >= 100){
        rank = "延長線安全小達人";
        stars = "⭐⭐⭐";
    }else if(score >= 60){
        rank = "安全用電好幫手";
        stars = "⭐⭐";
    }

    document.getElementById("rankText").textContent = rank;
    document.getElementById("stars").textContent = stars;

    // 顯示錯題回顧
    const review = document.getElementById("wrongReview");

    if(wrongAnswers.length === 0){
        review.innerHTML = `
            <h3>錯題回顧</h3>
            <div class="review-item">太棒了！本次沒有答錯題目。</div>
        `;
    }else{
        review.innerHTML = `
            <h3>錯題回顧</h3>
        ` + wrongAnswers.map(wrong => `
            <div class="review-item">
                <b>${wrong.title}</b><br>
                題目：${wrong.question}<br>
                正確答案：${wrong.correctAnswer}<br>
                重點：${wrong.explanation}
            </div>
        `).join("");
    }

    showScreen("result");
}

/* =========================================================
   顯示提示
========================================================= */

function showHint(){
    alert("提示：" + levels[current].hint);
}

/* =========================================================
   回首頁確認
========================================================= */

function confirmHome(){
    if(confirm("確定要離開目前關卡嗎？")){
        showScreen("home");
    }
}

/* =========================================================
   停止計時器
========================================================= */

function stopTimer(){
    if(timer){
        clearInterval(timer);
        timer = null;
    }
}

/* =========================================================
   更新倒數秒數
========================================================= */

function updateTimer(){
    document.getElementById("timerText").textContent = timeLeft;
}

/* =========================================================
   初始化首頁關卡清單
========================================================= */

buildPreview();
</script>
